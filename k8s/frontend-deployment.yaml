apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperlessfamily-frontend
  namespace: paperlessfamily
spec:
  replicas: 2
  selector:
    matchLabels:
      app: paperlessfamily-frontend
  template:
    metadata:
      labels:
        app: paperlessfamily-frontend
    spec:
      containers:
      - name: frontend
        image: ${DOCKER_USERNAME}/paperlessfamily-frontend:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: 128Mi
            cpu: 100m
          limits:
            memory: 256Mi
            cpu: 200m
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
