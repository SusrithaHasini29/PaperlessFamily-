version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: paperlessfamily-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: paperlessfamily
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d paperlessfamily"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - paperlessfamily-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: paperlessfamily-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/paperlessfamily
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-paperlessfamily-default-jwt-secret-key-change-in-production}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - paperlessfamily-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: paperlessfamily-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - paperlessfamily-network

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local

networks:
  paperlessfamily-network:
    driver: bridge
