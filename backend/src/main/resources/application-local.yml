spring:
  datasource:
    url: jdbc:h2:mem:paperlessfamily;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: paperlessfamily-default-jwt-secret-key-change-in-production-must-be-256-bits
    expiration: 86400000
  storage:
    upload-dir: ./uploads
